name: build-windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch whisper.cpp Windows binary
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/ggerganov/whisper.cpp/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match "whisper-bin-x64\.zip$" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match "x64.*\.zip$" } | Select-Object -First 1 }
          Write-Host "whisper asset:" $asset.name
          curl.exe -L -o whisper.zip $asset.browser_download_url
          Expand-Archive whisper.zip -DestinationPath whisper-bin -Force
          New-Item -ItemType Directory -Force app-resources/windows/bin | Out-Null
          Get-ChildItem -Recurse whisper-bin -Include *.exe,*.dll | ForEach-Object { Copy-Item $_.FullName app-resources/windows/bin/ -Force }
          # normalise the transcriber name
          if ((Test-Path app-resources/windows/bin/main.exe) -and -not (Test-Path app-resources/windows/bin/whisper-cli.exe)) {
            Copy-Item app-resources/windows/bin/main.exe app-resources/windows/bin/whisper-cli.exe
          }
          Get-ChildItem app-resources/windows/bin

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          curl.exe -L -o ff.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Expand-Archive ff.zip -DestinationPath ff -Force
          $ffexe = Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Recurse ff -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffexe.FullName app-resources/windows/bin/ffmpeg.exe -Force
          Copy-Item $ffprobe.FullName app-resources/windows/bin/ffprobe.exe -Force

      - name: Fetch model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-resources/windows/models | Out-Null
          curl.exe -L -o app-resources/windows/models/ggml-base.en.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"

      - name: Sign bundled binaries (if signing configured)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: app-resources/windows/bin
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build MSI
        shell: cmd
        run: gradlew.bat packageMsi --no-daemon --stacktrace

      - name: Locate MSI
        shell: pwsh
        run: Get-ChildItem -Recurse build/compose/binaries -Filter *.msi

      - name: Sign MSI (if signing configured)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: build/compose/binaries/main/msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: witbound-windows-msi
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
